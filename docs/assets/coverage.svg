            <text x="920" y="193" class="value">92.86%</text>
            <text x="188" y="220" class="metric">functions</text>
            <rect x="280" y="206" width="620" height="18" rx="9" fill="#1e293b"/>
            <rect x="280" y="206" width="543" height="18" rx="9" fill="#14b8a6"/>
            <text x="920" y="220" class="value">87.50%</text>
        <text x="42" y="290" class="file">content.js</text>

            <text x="188" y="290" class="metric">lines</text>
            <rect x="280" y="276" width="620" height="18" rx="9" fill="#1e293b"/>
            <rect x="280" y="276" width="584" height="18" rx="9" fill="#ef4444"/>
            <text x="920" y="290" class="value">94.13%</text>
            <text x="188" y="317" class="metric">branches</text>
            <rect x="280" y="303" width="620" height="18" rx="9" fill="#1e293b"/>
            <rect x="280" y="303" width="527" height="18" rx="9" fill="#8b5cf6"/>
            <text x="920" y="317" class="value">85.07%</text>
            <text x="188" y="344" class="metric">functions</text>
            <rect x="280" y="330" width="620" height="18" rx="9" fill="#1e293b"/>
            <rect x="280" y="330" width="564" height="18" rx="9" fill="#14b8a6"/>
            <text x="920" y="344" class="value">90.91%</text>
        <text x="42" y="414" class="file">popup.js</text>

            <text x="188" y="414" class="metric">lines</text>
            <rect x="280" y="400" width="620" height="18" rx="9" fill="#1e293b"/>
            <rect x="280" y="400" width="586" height="18" rx="9" fill="#ef4444"/>
            <text x="920" y="414" class="value">94.44%</text>
            <text x="188" y="441" class="metric">branches</text>
            <rect x="280" y="427" width="620" height="18" rx="9" fill="#1e293b"/>
